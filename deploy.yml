# Builds the Tracewell site and publishes it to GitHub Pages on every push to main.
#   site/      -> copied as-is to the site root (tracewell.co.ke)
#   demo-app/  -> exported with Shinylive to /demo (tracewell.co.ke/demo)
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          Rscript -e 'shinylive::export("demo-app", "_site/demo")'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
